---

- name: Install xen packages
  apt:
    name:
      - xen-system
      - qemu-system-xen
    state: present

- name: Install xend-config.xsp
  copy:
    src: xend-config.xsp
    dest: /etc/xen/xend-config.xsp
    owner: root
    group: root
    mode: "0644"

- name: Disable Xen autoballooning
  lineinfile:
    path: /etc/xen/xl.conf
    regexp: "^#autoballon"
    line: "autoballon=0"

- name: Disable Xen save/restore
  lineinfile:
    path: /etc/default/xendomains
    regexp: "^XENDOMAINS_SAVE"
    line: "XENDOMAINS_SAVE="

- name: Set Xen hypervisor command line (dom0 memory)
  lineinfile:
    path: /etc/default/grub.d/xen.cfg
    regexp: "^#?GRUB_CMDLINE_XEN_DEFAULT="
    line: 'GRUB_CMDLINE_XEN_DEFAULT="dom0_mem=1G,max:1G"'

- name: Generate grub.cfg so the Xen menuentry exists for lookup
  command: update-grub

- name: Find the title of the top-level Xen menuentry
  shell: awk -F"'" '/^menuentry .*Xen hypervisor/ {print $2; exit}' /boot/grub/grub.cfg
  register: xen_menuentry_title
  changed_when: false
  failed_when: xen_menuentry_title.stdout == ""

- name: Pin Xen menuentry as GRUB default (by title, stable across kernel updates)
  lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_DEFAULT="
    line: 'GRUB_DEFAULT="{{ xen_menuentry_title.stdout }}"'

- name: Regenerate grub.cfg with Xen as the default
  command: update-grub

- name: Reboot and wait for hosts to activate Xen environment
  reboot:
    msg: "Reboot for Xen setup"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: whoami
