---

- name: Install xen packages
  apt:
    name:
      - xen-system
      - qemu-system-xen
    state: present

- name: Install xend-config.xsp
  copy:
    src: xend-config.xsp
    dest: /etc/xen/xend-config.xsp
    owner: root
    group: root
    mode: "0644"

- name: Disable Xen autoballooning
  lineinfile:
    path: /etc/xen/xl.conf
    regexp: "^#autoballon"
    line: "autoballon=0"

- name: Disable Xen save/restore
  lineinfile:
    path: /etc/default/xendomains
    regexp: "^XENDOMAINS_SAVE"
    line: "XENDOMAINS_SAVE="

- name: Set Xen hypervisor command line (dom0 memory)
  lineinfile:
    path: /etc/default/grub.d/xen.cfg
    regexp: "^#?GRUB_CMDLINE_XEN_DEFAULT="
    line: 'GRUB_CMDLINE_XEN_DEFAULT="dom0_mem=1G,max:1G"'

# Throwaway QA VMs only ever need to boot as Xen dom0. Suppressing the
# non-Xen entry generator leaves the Xen multiboot menuentries as the
# only choice in grub.cfg, so GRUB_DEFAULT=0 picks them unconditionally —
# no fragile title/index/ID matching against grub-mkconfig output.
- name: Suppress non-Xen GRUB entries (10_linux)
  file:
    path: /etc/grub.d/10_linux
    mode: a-x

- name: Make Xen the default GRUB entry (it is now the only one)
  lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_DEFAULT="
    line: "GRUB_DEFAULT=0"

- name: Regenerate grub.cfg with only Xen entries
  command: update-grub

- name: Reboot and wait for hosts to activate Xen environment
  reboot:
    msg: "Reboot for Xen setup"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: whoami

- name: Assert that Xen dom0 is actually running after the reboot
  command: cat /sys/hypervisor/type
  register: hypervisor_type
  changed_when: false
  failed_when: hypervisor_type.stdout != "xen"

# /sys/hypervisor/type goes "xen" the moment the dom0 kernel boots, but
# the toolstack (xenfs on /proc/xen, xenstored, /dev/xen/privcmd, ...)
# only comes up later when xen.service runs. If we proceed to cluster
# init before that, ganeti-noded's `xl info` calls fail with
# "Could not obtain handle on privileged command interface" and
# `gnt-cluster verify` reports the xl toolstack as missing.
- name: Wait for Xen toolstack to become usable
  command: xl info
  register: xl_info
  retries: 30
  delay: 2
  until: xl_info.rc == 0
  changed_when: false
